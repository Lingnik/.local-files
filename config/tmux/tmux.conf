setw -g mouse on
set-option -g history-limit 200000
setw -g mode-keys vi

# vim-style keybinds for pane swaps
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key C-k clear-history  # prefix Ctrl-k (no longer steals plain Ctrl-k from readline/nvim)

# Reload this config in place: prefix r
bind r source-file ~/.local/config/tmux/tmux.conf \; display "reloaded"

set -g set-clipboard on
set -g renumber-windows on

# ---- Status bar -----------------------------------------------------------
# Active tab gets a blue background; bells flash red.
# monitor-activity is intentionally OFF — too noisy with many windows producing
# routine output. Bells (explicit \a signals) are kept as the only highlight.
setw -g monitor-activity off
setw -g monitor-bell on
set -g visual-activity off
set -g visual-bell off
set -g status-style "bg=black,fg=white"
set -g window-status-style "fg=white,bg=colour236"
set -g window-status-current-style "bg=colour55,fg=white,bold"
set -g window-status-last-style "fg=white,bg=colour54"
set -g window-status-bell-style "bg=red,fg=white,bold"
set -g status-left " #h #S:#I.#P "
set -g status-left-length 40
set -g status-right " %a %H:%M #{?client_prefix, #[bg=red#,fg=white#,bold] C-b #[default],} "
set -g status-right-length 60
set -g window-status-separator " "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# ---- Proposed additions (uncomment to enable, one block at a time) --------

# Kill the 500ms <Esc> delay (huge for nvim).
# set -sg escape-time 10

# Let nvim/etc see focus changes (enables :checktime auto-reload, etc).
set -g focus-events on

# True color + italics inside tmux. Required for modern nvim themes to look right.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# vim-style copy: prefix [ to enter copy mode, v to select, y to yank.
# Yanked text goes to the macOS clipboard via set-clipboard (already on above).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# Memorable splits that open in current pane's working dir.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Cmd+Opt+Left/Right -> previous/next window.
# iTerm2 must be configured to send these escape sequences for Cmd+Opt+Arrow:
#   Cmd+Opt+Left  -> Send Escape Sequence: [1;9D
#   Cmd+Opt+Right -> Send Escape Sequence: [1;9C
set -s user-keys[0] "\e[1;9D"
set -s user-keys[1] "\e[1;9C"
bind -n User0 previous-window
bind -n User1 next-window
